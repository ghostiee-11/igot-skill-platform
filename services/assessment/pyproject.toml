[project]
name = "igot-assessment-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pydantic-settings>=2.2", "python-jose[cryptography]>=3.3", "python-multipart>=0.0.9", "httpx>=0.27", "celery>=5.4", "alembic>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
